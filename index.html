<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#180510">
<title>Velvet Hearts — Opening</title>
<link rel="stylesheet" href="css/3d-opening.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#180510}
#vh-3d-opening{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;display:grid;place-items:center}
.vh3d-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vh3d-glow{position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,0,12,.85),rgba(20,0,12,.12) 70%)}
.vh3d-copy{position:relative;z-index:2;text-align:center;padding:24px;width:100%;color:white}
.vh3d-copy h1{font-size:clamp(2.8rem,12vw,5.5rem);margin:16px 0;color:#ffe1ec;text-shadow:0 0 25px #ff438b}
.vh3d-eyebrow{letter-spacing:4px;text-transform:uppercase;font-size:12px}
.vh3d-subtitle{margin:0 auto 28px;max-width:340px}
.vh3d-enter,.vh3d-exit{position:relative;z-index:3;border:1px solid #f5b6cc;border-radius:40px;padding:14px 24px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.vh3d-enter{background:#a51f59;color:white}
.vh3d-exit{position:absolute;top:20px;right:16px;background:#200c1bbd;color:white}
.vh3d-hint{font-size:12px;margin-top:18px;color:#f4d9e4}
</style>
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
<section id="vh-3d-opening" aria-label="Velvet Hearts opening">
<video class="vh3d-video" autoplay muted loop playsinline>
<source src="videos/anime-opening.mp4" type="video/mp4">
</video>
<div class="vh3d-glow"></div>
<a class="vh3d-exit" href="home.html">Skip intro</a>
<div class="vh3d-copy">
<div class="vh3d-eyebrow">A little world made of love</div>
<h1>Velvet Hearts</h1>
<div class="vh3d-subtitle">Some stories are better when you step inside.</div>
<div style="max-width:340px;margin:0 auto 20px">
<label for="vh-visitor-name" style="display:block;margin-bottom:9px;color:#ffe1ec">First, what should I call you?</label>
<input id="vh-visitor-name" type="text" maxlength="40" autocomplete="given-name" placeholder="Enter your name" style="width:100%;padding:14px;border-radius:25px;border:1px solid #f5b6cc;background:#240b1b;color:white;font-size:16px;text-align:center">
<p id="vh-name-error" role="alert" style="display:none;color:#ffd0df;font-size:13px">Please enter your name first.</p>
</div>
<button class="vh3d-enter" id="vh-start" type="button" style="font-family:inherit">Enter Velvet Hearts ♡</button>
<div class="vh3d-hint">Your story begins here.</div>
</div>
</section>

<script src="js/music-optin.js" defer></script>
<script src="js/velvet-upgrade.js" defer></script>
<script src="js/visitor-response-email.js" defer></script>
</body>
</html>
